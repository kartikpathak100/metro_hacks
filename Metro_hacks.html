<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4f8a">
<title>GMRC Master Dispatch & Headway Recommender - PS-04</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14202b;--mut:#5b6775;--line:#dde2e9;--pri:#0b4f8a;--pri2:#e6f0fa;--ok:#1b7a3e;--okbg:#e5f4ea;--wn:#9a5b00;--wnbg:#fdf0d8;--bl:#0b4f8a;--blbg:#e6f0fa;--er:#b3261e;--tsame:#eef0f3;--pre:#f7f8fa;--inp:#fff;--onpri:#fff;--vn:#0f4d26;--vb:#5e3800;--vq:#083a68}
:root[data-theme=dark]{--bg:#0e141b;--card:#18212b;--ink:#e8edf3;--mut:#9fb0c2;--line:#2b3846;--pri:#5aa9ee;--pri2:#16314a;--ok:#5fd18a;--okbg:#12301f;--wn:#f0b45a;--wnbg:#3a2a0c;--bl:#7db8f2;--blbg:#12304b;--er:#ff8a80;--tsame:#263240;--pre:#121a22;--inp:#121a22;--onpri:#07121c;--vn:#bfeccf;--vb:#fbe0b0;--vq:#c4def7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Gujarati","Noto Sans Devanagari",sans-serif}

.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px 110px}

header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;gap:8px}
.brand{font-weight:700;font-size:19px;color:var(--pri);letter-spacing:.2px}
.lang{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;padding:8px 11px;font:600 15px inherit;font-family:inherit;color:var(--mut);min-height:40px}
.lang button.on{background:var(--pri);color:var(--onpri)}

h1{font-size:28px;line-height:1.2;margin:10px 0 2px}
h2{font-size:19px;margin:26px 0 10px}
.date{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.verdict{border-radius:16px;padding:20px;margin:6px 0 4px}
.verdict b{display:block;font-size:24px;margin-bottom:4px}
.v-n{background:var(--okbg);color:var(--vn)}.v-b{background:var(--wnbg);color:var(--vb)}.v-q{background:var(--blbg);color:var(--vq)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:78px;padding:10px 6px;background:var(--card);border:2px solid var(--line);border-radius:14px;font:600 16px/1.2 inherit;font-family:inherit;color:var(--ink);text-align:center}
.opt svg{width:26px;height:26px}
.opt.on{border-color:var(--pri);background:var(--pri2);color:var(--pri)}
.opt.row{width:100%;flex-direction:row;justify-content:flex-start;min-height:56px;padding:10px 14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--pri);color:var(--onpri);font:700 18px inherit;font-family:inherit;margin-top:12px;text-decoration:none}
.btn.alt{background:var(--card);color:var(--pri);border:2px solid var(--pri)}
.btn svg{width:22px;height:22px}
input[type=date],input[type=number],input[type=text],select{width:100%;min-height:52px;font:18px inherit;font-family:inherit;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:6px;background:var(--inp);color:var(--ink)}
.band{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.band.chg{border-left:6px solid var(--wn)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top b{font-size:17px;color:var(--mut);font-weight:600}
.tag{font:700 13px inherit;font-family:inherit;padding:4px 10px;border-radius:99px}
.t-more{background:var(--wnbg);color:var(--wn)}.t-less{background:var(--blbg);color:var(--bl)}.t-same{background:var(--tsame);color:var(--mut)}
.big{font-size:30px;font-weight:700;margin:6px 0 0}
.sub{color:var(--mut);font-size:16px}
.why{margin-top:8px;font-size:16px}
.load{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:16px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%}
.link{border:0;background:none;color:var(--pri);font:700 16px inherit;font-family:inherit;padding:10px 0 0;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips .opt{min-height:48px;padding:6px 14px;flex-direction:row;font-size:17px}
.err{color:var(--er);font-weight:600;font-size:15px}
pre{white-space:pre-wrap;word-break:break-word;margin:12px 0 0;padding:14px;background:var(--pre);border:1px solid var(--line);border-radius:12px;font:16px/1.55 inherit;font-family:inherit}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.stat:last-of-type{border:0}.stat b{font-size:22px}.stat span{color:var(--mut);font-size:16px}
.note{color:var(--mut);font-size:15px}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 18px;margin-bottom:12px}
summary{min-height:52px;display:flex;align-items:center;font-weight:700;cursor:pointer}
label{display:block;margin-top:12px;color:var(--mut);font-size:15px}

/* --- Navigation Bar --- */
nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--card);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 100;
}
nav div {
  max-width: 560px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
}
nav button {
  border: 0;
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 9px 0 8px;
  font: 600 12px inherit;
  font-family: inherit;
  color: var(--mut);
  min-height: 62px;
  cursor: pointer;
}
nav button svg { width: 26px; height: 26px; }
nav button.on { color: var(--pri); }

.hide{display:none}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#14202b;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;font-size:16px}
#toast.on{opacity:1}
button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #7fb2e5;outline-offset:2px}
.ibtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:44px;height:42px;display:grid;place-items:center;padding:0}
.ibtn svg{width:22px;height:22px}
.map{width:100%;height:auto;display:block}.map text{fill:var(--ink);font:12px system-ui,sans-serif}.map .mt{font-weight:700}.map .sm{fill:var(--mut);font-size:11px}
details label+input,details label+select{margin-top:4px}
.back{margin-top:6px}

/* --- Print Styles --- */
@media print {
  body { background: #fff !important; color: #000 !important; font-size: 12pt !important; }
  nav, header .lang, header .ibtn, .btn, .link, .opts, details, .noprint { display: none !important; }
  .app { max-width: 100% !important; padding: 0 !important; }
  .card, .band { border: 1px solid #000 !important; box-shadow: none !important; background: #fff !important; color: #000 !important; page-break-inside: avoid; }
  .dispatch-sheet { display: block !important; }
}

.dispatch-sheet { display: none; }

/* --- Desktop Mode (Screens >= 840px) --- */
@media (min-width: 840px) {
  .app { max-width: 1080px; padding: 0 24px 40px; }
  nav {
    position: static;
    border-top: none;
    border-bottom: 1px solid var(--line);
    background: var(--card);
    border-radius: 14px;
    margin: 12px 0 24px 0;
    padding: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  nav div { max-width: 100%; display: flex; justify-content: flex-start; gap: 8px; }
  nav button { flex-direction: row; gap: 8px; min-height: 44px; padding: 8px 18px; border-radius: 10px; }
  nav button.on { background: var(--pri2); color: var(--pri); }
  #toast { bottom: 24px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="noprint">
    <span class="brand" id="brand">Metro Planner</span>
    <div style="display:flex;gap:8px">
      <button class="ibtn" id="theme"></button>
      <div class="lang" id="lang">
        <button data-lang="en">EN</button>
        <button data-lang="gu">ગુજ</button>
        <button data-lang="hi">हिं</button>
      </div>
    </div>
  </header>
  
  <nav class="noprint"><div id="nav"></div></nav>
  
  <main id="main"></main>
</div>

<div id="toast"></div>

<script id="engine">
"use strict";
const LDEF_LADDER=[5,6,8,10,12,15,20];
const LDEF_BANDS=[["06:00-08:00",2,15,2300],["08:00-11:00",3,10,3900],["11:00-16:00",5,15,2100],["16:00-20:00",4,10,4100],["20:00-22:00",2,15,1900],["22:00-24:00",2,20,650]].map(([label,hours,bh,pph])=>({label,hours,bh,pph}));
const LDEF_EV={"None":[1,1,1,1,1,1],"IPL Match":[1,1,1.05,1.4,1,6],"Navratri Night":[1,1,1,1.15,1.8,4],"University Exams":[1.25,1.3,1.15,1,1,1]};
const LDEF_WX={"Clear":[1,1,1,1,1,1],"Light Drizzle":[1.05,1.05,1.05,1.05,1.05,1.05],"Heavy Rain":[1.1,1.15,1.1,1.2,1.15,1.1],"Extreme Heat":[1,1.08,1.08,1.1,1.1,1]};

let LADDER=[...LDEF_LADDER];
let B=JSON.parse(JSON.stringify(LDEF_BANDS));
let EV=JSON.parse(JSON.stringify(LDEF_EV));
let WX=JSON.parse(JSON.stringify(LDEF_WX));

const DY={"Weekday":[1,1,1,1,1,1],"Weekend/Holiday":[0.6,0.7,0.95,0.85,1.1,1]};
const PDEF={cap:900,load:0.85,cycle:60,fleet:12,minH:5,maxH:20,quiet:0.75,fare:20,loss:0.5,cost:0};
const PLABEL={cap:"Passengers per train",load:"Target max load (0.6-1)",cycle:"Round-trip time (min)",fleet:"Rakes available",minH:"Shortest safe headway (min)",maxH:"Longest headway (15 or 20)",fare:"Average fare (₹)",loss:"Overflow lost to road (0-1)",cost:"Cost per extra trip (₹, GMRC figure)"};
const LG=["en","gu","hi"],LANGS={en:"English",gu:"ગુજરાતી",hi:"हिन्दी"};
const FT={
"IPL Match":{en:"IPL match crowd (stadium arrivals and departures)",gu:"IPL મેચની ભીડ (સ્ટેડિયમ તરફ આવનજાવન)",hi:"IPL मैच की भीड़ (स्टेडियम आना-जाना)"},
"Navratri Night":{en:"Navratri night crowds",gu:"નવરાત્રિની રાત્રિની ભીડ",hi:"नवरात्रि की रात की भीड़"},
"University Exams":{en:"university exam travel",gu:"યુનિવર્સિટી પરીક્ષા માટેની મુસાફરી",hi:"विश्वविद्यालय परीक्षा के लिए यात्रा"},
"Heavy Rain":{en:"heavy rain (riders move from two-wheelers to the metro)",gu:"ભારે વરસાદ (ટુ-વ્હીલર છોડી મુસાફરો મેટ્રો તરફ વળે છે)",hi:"भारी बारिश (दोपहिया छोड़कर लोग मेट्रो की ओर)"},
"Light Drizzle":{en:"light drizzle",gu:"હળવો ઝરમર વરસાદ",hi:"हल्की बूंदाबांदी"},
"Extreme Heat":{en:"extreme heat (fewer people walk or ride two-wheelers)",gu:"અતિશય ગરમી (ચાલવા કે ટુ-વ્હીલર ચલાવવાનું ઓછું)",hi:"अत्यधिक गर्मी (पैदल या दोपहिया कम)"},
"Weekend/Holiday":{en:"weekend or public holiday (fewer office commuters)",gu:"સપ્તાહાંત કે જાહેર રજા (ઓફિસ જનારા ઓછા)",hi:"सप्ताहांत या सार्वजनिक अवकाश (ऑफिस यात्री कम)"},
"_":{en:"historical demand pattern",gu:"ઐતિહાસિક માંગની પેટર્ન",hi:"पिछले आंकड़ों का मांग पैटर्न"}};
const TM={
en:{s:"{band}: shorten headway {base} → {dyn} min ({rakes} rakes). Why: {why}.",l:"{band}: lengthen headway {base} → {dyn} min ({rakes} rakes). Why: {why}.",kw:"{band}: keep headway at {dyn} min ({rakes} rakes). Current service can absorb: {why}.",kn:"{band}: keep headway at {dyn} min ({rakes} rakes). Normal demand.",f:" Limited by fleet: only {fleet} rakes available.",o:" (Manual override by operator.)"},
gu:{s:"{band}: ટ્રેનો વચ્ચેનું અંતર {base} → {dyn} મિનિટ કરો ({rakes} રેક). કારણ: {why}.",l:"{band}: ટ્રેનો વચ્ચેનું અંતર {base} → {dyn} મિનિટ વધારો ({rakes} રેક). કારણ: {why}.",kw:"{band}: અંતર {dyn} મિનિટ જ રાખો ({rakes} રેક). હાલની સેવા પૂરતી છે: {why}.",kn:"{band}: અંતર {dyn} મિનિટ જ રાખો ({rakes} રેક). સામાન્ય માંગ.",f:" રેકની મર્યાદા: ફક્ત {fleet} રેક ઉપલબ્ધ.",o:" (ઓપરેટરે જાતે ફેરફાર કર્યો.)"},
hi:{s:"{band}: ट्रेनों का अंतराल {base} → {dyn} मिनट करें ({rakes} रेक)। कारण: {why}।",l:"{band}: ट्रेनों का अंतराल {base} → {dyn} मिनट बढ़ाएं ({rakes} रेक)। कारण: {why}।",kw:"{band}: अंतराल {dyn} मिनट ही रखें ({rakes} रेक)। मौजूदा सेवा पर्याप्त है: {why}।",kn:"{band}: अंतराल {dyn} मिनट ही रखें ({rakes} रेक)। सामान्य मांग।",f:" रेक की सीमा: केवल {fleet} रेक उपलब्ध।",o:" (ऑपरेटर द्वारा मैन्युअल बदलाव।)"}};
const NM={
ev:{"None":{en:"No special event",gu:"કોઈ ખાસ કાર્યક્રમ નથી",hi:"कोई विशेष आयोजन नहीं"},"IPL Match":{en:"IPL Match",gu:"IPL મેચ",hi:"IPL मैच"},"Navratri Night":{en:"Navratri Night",gu:"નવરાત્રિ રાત્રિ",hi:"नवरात्रि की रात"},"University Exams":{en:"University Exams",gu:"યુનિવર્સિટી પરીક્ષા",hi:"विश्वविद्यालय परीक्षा"}},
wx:{"Clear":{en:"Clear",gu:"સ્વચ્છ હવામાન",hi:"साफ मौसम"},"Light Drizzle":{en:"Light Drizzle",gu:"હળવો ઝરમર વરસાદ",hi:"हल्की बूंदाबांदी"},"Heavy Rain":{en:"Heavy Rain",gu:"ભારે વરસાદ",hi:"भारी बारिश"},"Extreme Heat":{en:"Extreme Heat",gu:"અતિશય ગરમી",hi:"अत्यधिक गर्मी"}},
dy:{"Weekday":{en:"Weekday",gu:"કામકાજનો દિવસ",hi:"कार्य दिवस"},"Weekend/Holiday":{en:"Weekend/Holiday",gu:"સપ્તાહાંત/જાહેર રજા",hi:"सप्ताहांत/सार्वजनिक अवकाश"}}};
const WA={
en:{t:"🚇 *Gujarat Metro - Headway Plan for {date}*",c:"Conditions: {day} | {wx} | {ev}",h:"*Train every ...*",l:"• {band}: every *{dyn} min* ({rakes} rakes, was {base})",ch:"*Changes and reasons:*",n:"No headway changes needed - run the normal timetable.",f:"Station controllers: please brief staff and update platform announcements.\n_Draft from planning tool - confirm with the control room before use._"},
gu:{t:"🚇 *ગુજરાત મેટ્રો - {date} માટે ટ્રેન અંતરની યોજના*",c:"પરિસ્થિતિ: {day} | {wx} | {ev}",h:"*ટ્રેન દર ...*",l:"• {band}: દર *{dyn} મિનિટે* ({rakes} રેક, પહેલાં {base})",ch:"*ફેરફારો અને કારણો:*",n:"અંતરમાં કોઈ ફેરફારની જરૂર નથી - સામાન્ય ટાઇમટેબલ ચલાવો.",f:"સ્ટેશન કંટ્રોલર્સ: સ્ટાફને જાણ કરો અને પ્લેટဖોર્મ જાહેરાતો અપડેટ કરો.\n_આ ડ્રાફ્ટ છે - ઉપયોગ પહેલાં કંટ્રોલ રૂમ સાથે ખાતરી કરો._"},
hi:{t:"🚇 *गुजरात मेट्रो - {date} के लिए ट्रेन अंतराल योजना*",c:"स्थिति: {day} | {wx} | {ev}",h:"*ट्रेन हर ...*",l:"• {band}: हर *{dyn} मिनट* पर ({rakes} रेक, पहले {base})",ch:"*बदलाव और कारण:*",n:"अंतराल में किसी बदलाव की जरूरत नहीं - सामान्य टाइमटेबल चलाएं।",f:"स्टेशन कंट्रोलर: कृपया स्टाफ को सूचित करें और प्लेटफ़ॉर्म घोषणाएं अपडेट करें।\n_यह मसौदा है - उपयोग से पहले कंट्रोल रूम से पुष्टि करें।_"}};

const LDEF=[{id:"red",name:"Red Line",color:"#d93025",ends:["APMC","Motera Stadium"],level:1.1,cycle:60,fleet:9,w:{"IPL Match":1,"Navratri Night":0.7,"University Exams":1}},
{id:"blue",name:"Blue Line",color:"#2b6fe0",ends:["Thaltej Gam","Vastral Gam"],level:0.9,cycle:60,fleet:8,w:{"IPL Match":0.4,"Navratri Night":0.7,"University Exams":1}}];
let LINES=JSON.parse(JSON.stringify(LDEF)),RULES=[];
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
const S={date:"",ev:"None",w:"Clear",hol:false,lang:"en",ov:{}};
let P={...PDEF}, lookup={};

function dayType(d,hol){const g=d.getDay();return(g===0||g===6||hol)?"Weekend/Holiday":"Weekday"}

function ruleMult(i,ev,w,dt,ew=1){
  let m=1; const f=[];
  const evArr = EV[ev] || [1,1,1,1,1,1];
  const wxArr = WX[w] || [1,1,1,1,1,1];
  const dyArr = DY[dt] || [1,1,1,1,1,1];
  for(const [n,v] of [[ev, 1 + ((evArr[i] ?? 1) - 1) * ew], [w, wxArr[i] ?? 1], [dt, dyArr[i] ?? 1]]){
    m *= v;
    if(Math.abs(v - 1) >= 0.05 && FT[n]) f.push(n);
  }
  return [m, f];
}

function customMult(i,ev,w,dt,date,lid){let m=1;const f=[];
  for(const r of RULES){if(!r.on||!r.bands[i])continue;
    if(r.ev!=="any"&&r.ev!==ev)continue;if(r.wx!=="any"&&r.wx!==w)continue;if(r.day!=="any"&&r.day!==dt)continue;

  const [y,mth,d]=S.date.split("-");
  return `<button class="link back" data-go="tt">‹ ${T("back")}</button>
  <div class="card" style="margin-top:14px; border: 2px solid var(--pri);">
    <div style="text-align:center; border-bottom: 2px solid var(--line); padding-bottom: 12px; margin-bottom: 14px;">
      <h2 style="margin:0; color:var(--pri);">GUJARAT METRO RAIL CORPORATION (GMRC)</h2>
      <p style="margin:4px 0 0; font-weight:700;">CONTROL ROOM DAILY HEADWAY & DISPATCH ORDER</p>
      <p class="note" style="margin:2px 0 0">Ref: GMRC/OPS/DS/${S.date}/04</p>
    </div>
    <div class="stat"><span>Date</span><b>${d}-${mth}-${y}</b></div>
    <div class="stat"><span>Active Conditions</span><b>${NM.dy[pl[0].dt]?.[S.lang]||pl[0].dt} | ${NM.wx[S.w]?.[S.lang]||S.w} | ${NM.ev[S.ev]?.[S.lang]||S.ev}</b></div>
    <div class="stat"><span>Total Revenue Protected</span><b>${inr(m.rev)}</b></div>
    
    <h3 style="margin:16px 0 8px">Authorized Timeband Headway Schedule</h3>
    <table>
      <tr><th>Band</th><th>Headway</th><th>Rakes</th><th>Load</th></tr>
      ${pl.map(r=>`<tr><td><b>${r.band}</b></td><td><b>${r.dyn} min</b> (was${r.base})</td><td>${r.rd} rakes</td><td>${(r.lfd*100).toFixed(0)}%</td></tr>`).join("")}
    </table>

    <div style="margin-top:24px; display:grid; grid-template-columns:1fr 1fr; gap:20px; text-align:center">
      <div style="border-top:1px solid var(--ink); padding-top:6px"><b>Station Controller</b><br><span class="note">Signature & Stamp</span></div>
      <div style="border-top:1px solid var(--ink); padding-top:6px"><b>Chief Controller (OCC)</b><br><span class="note">Authorized Sign-off</span></div>
    </div>
  </div>
  <button class="btn noprint" onclick="window.print()">${T("dispatch_btn")}</button>`;
}
function setTheme(m){document.documentElement.dataset.theme=m;store.set("mh_theme",m);$("theme").innerHTML=ic(m==="dark"?"clear":"moon");$("theme").setAttribute("aria-label",m==="dark"?"Light mode":"Dark mode")}
function render(){
  const pl=window._pl=plan();
  $("main").innerHTML={home,tt:timetable,map:mapScreen,msg:message,more,rules:rulesScreen,dispatch:dispatchScreen,matrix:matrixScreen}[screen](pl);
  $("nav").innerHTML=[["home","home","n_home"],["tt","clock","n_tt"],["map","map","n_map"],["msg","chat","n_msg"],["more","more","n_more"]].map(([k,i,l])=>`<button data-go="${k}" class="${(screen==="rules"||screen==="dispatch"||screen==="matrix"?"more":screen)===k?"on":""}">${ic(i)}${T(l)}</button>`).join("");
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===S.lang));
  $("brand").textContent=T("brand");document.documentElement.lang=S.lang;
}
function go(s){screen=s;openBand=null;render();scrollTo(0,0)}
document.addEventListener("click",async e=>{
  const el=e.target.closest("button,a");if(!el)return;const d=el.dataset;
  if(el.id==="theme")return setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
  if(d.tl!==undefined)return(tl=d.tl||null,render());
  if(d.mb!==undefined)return(mapBand=+d.mb,render());
  if(d.act==="dispatch")return go("dispatch");
  if(d.act==="matrix")return go("matrix");
  if(d.act==="savemat"){
    try{
      const ladTxt=$("mat_ladder").value;
      LADDER=ladTxt.split(",").map(x=>parseFloat(x.trim())).filter(x=>!isNaN(x)&&x>0);
      document.querySelectorAll("[data-mb-i]").forEach(inp=>{
        const i=+inp.dataset.mbI, k=inp.dataset.mbK;
        if(k==="label") B[i].label=inp.value;
        if(k==="base_pph") B[i].pph=parseFloat(inp.value)||B[i].pph;
      });
      document.querySelectorAll("[data-ev-name]").forEach(inp=>{
        const ev=inp.dataset.evName;
        const vals=inp.value.split(",").map(x=>parseFloat(x.trim())).filter(x=>!isNaN(x));
        if(vals.length===6) EV[ev]=vals;
      });
      store.set("mh_ladder",LADDER); store.set("mh_bands",B); store.set("mh_ev",EV);
      toast("Master matrix saved!"); go("more");
    }catch(err){alert("Error saving: "+err.message)}
  }
  if(d.act==="addrule"){const id=Date.now().toString(36);RULES.push({id,name:"",on:true,ev:"any",wx:"any",day:"any",date:"",pct:20,bands:[true,true,true,true,true,true],line:"all",reason:""});openRule=id;store.set("mh_rules",RULES);return render()}
  if(d.rb){const[id,i]=d.rb.split(":"),r=RULES.find(x=>x.id===id);if(r){r.bands[+i]=!r.bands[+i];store.set("mh_rules",RULES)}return render()}
  if(d.rt){const r=RULES.find(x=>x.id===d.rt);if(r){r.on=!r.on;store.set("mh_rules",RULES)}return render()}
  if(d.rd){if(confirm(T("del")+"?")){RULES=RULES.filter(x=>x.id!==d.rd);store.set("mh_rules",RULES)}return render()}
  if(d.lang){S.lang=d.lang;mlang=null;store.set("mh_lang",S.lang);return render()}
  if(d.go)return go(d.go);
  if(d.g==="day"){dmode=d.v;if(d.v==="tomorrow"){const t=new Date();t.setDate(t.getDate()+1);S.date=iso(t)}S.ov={};mapBand=null;return render()}
  if(d.g==="wx"){S.w=d.v;S.ov={};mapBand=null;return render()}
  if(d.g==="ev"){S.ev=d.v;S.ov={};mapBand=null;return render()}
  if(d.g==="hol"){S.hol=!S.hol;S.ov={};mapBand=null;return render()}
  if(d.open!==undefined){openBand=openBand==+d.open?null:+d.open;return render()}
  if(d.g==="set"){const[i,h]=d.v.split(":").map(Number);if(h)S.ov[i]=h;else delete S.ov[i];return render()}
  if(d.ml){mlang=d.ml;return render()}
  if(d.act==="copy"){const t=$("msgtxt").textContent;try{await navigator.clipboard.writeText(t)}catch(x){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}return toast(T("copied"))}
  if(d.act==="dl"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("msgtxt").textContent],{type:"text/plain;charset=utf-8"}));a.download=`metro_message_${S.date}.txt`;a.click()}
  if(d.act==="reset"){localStorage.clear();location.reload()}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="dpick"){S.date=t.value||S.date;S.ov={};render()}
  if(t.id==="csv"&&t.files[0]){try{const r=parseCSV(await t.files[0].text());lookup=r.lk;$("csvInfo").textContent=r.n+" rows loaded."}catch(x){$("csvInfo").textContent=x.message}}
});
document.addEventListener("input",e=>{
  const x=e.target,ds=x.dataset||{};
  if(ds.k){const v=parseFloat(x.value);if(!isNaN(v)){P[ds.k]=v;store.set("mh_p",P)}}
  if(ds.r){const r=RULES.find(q=>q.id===ds.r);if(r){r[ds.f]=ds.f==="pct"?(parseFloat(x.value)||0):x.value;store.set("mh_rules",RULES)}}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.rid){if(d.open)openRule=d.dataset.rid;else if(openRule===d.dataset.rid)openRule=null}},true);
(function init(){
  const t=new Date();t.setDate(t.getDate()+1);S.date=iso(t);
  P={...PDEF,...(store.get("mh_p")||{})};S.lang=store.get("mh_lang")||"en";
  RULES=store.get("mh_rules")||[];
  if(store.get("mh_ladder")) LADDER=store.get("mh_ladder");
  if(store.get("mh_bands")) B=store.get("mh_bands");
  if(store.get("mh_ev")) EV=store.get("mh_ev");
  setTheme(store.get("mh_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
  render();
})();
</script>
</body>
</html>
